<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SeqPage</title>
    <link rel="icon" type="image/png" href="./icons/icon32.png" />
    <!--
      Manifest V3 的扩展页面 CSP 只允许加载本地脚本，禁止远程脚本与内联脚本。
      因此这里不引入任何 CDN 资源；Vite 会把入口脚本作为本地文件注入。
    -->

    <div id="app"></div>
    <noscript>SeqPage 需要启用 JavaScript 才能运行。</noscript>
    <script type="module" src="/src/main.ts"></script>

</html>
